name: Apply Assignment Blocker Migration

# One-time workflow — run manually from Actions → "Run workflow".
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with D1 edit access
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Applies migrations/0007_assignment_blocker.sql against the shared D1
# database (repo-dashboard-work-items) which both repos use:
#   ALTER TABLE assignments ADD COLUMN blocker TEXT;

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply assignment blocker migration to D1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute repo-dashboard-work-items --remote --file migrations/0007_assignment_blocker.sql
